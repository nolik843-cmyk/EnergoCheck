{% extends "base.html" %}

{% block title %}Вход | EnergoCheck{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h1 class="h3 mb-4">Вход в EnergoCheck</h1>
          {% if form.errors %}
            <div class="alert alert-danger">Проверьте имя пользователя и пароль.</div>
          {% endif %}
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Войти</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
