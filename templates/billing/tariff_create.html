{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <h1 class="h3 mb-4">Новый тариф</h1>
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Сохранить тариф</button>
            <a href="{% url 'billing_dashboard' %}" class="btn btn-outline-secondary">Назад</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
