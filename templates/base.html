<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}EnergoCheck{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/">EnergoCheck</a>
        <div class="navbar-nav ms-auto">
          {% if user.is_authenticated %}
            <a class="nav-link" href="/consumers/">Потребители</a>
            <a class="nav-link" href="/billing/">Биллинг</a>
            <a class="nav-link" href="/analytics/">Аналитика</a>
            <a class="nav-link" href="/employee/">Сотрудник</a>
            <form method="post" action="{% url 'logout' %}" class="d-inline">
              {% csrf_token %}
              <button type="submit" class="btn btn-link nav-link">Выйти</button>
            </form>
          {% else %}
            <a class="nav-link" href="{% url 'login' %}">Войти</a>
          {% endif %}
        </div>
      </div>
    </nav>

    {% block content %}{% endblock %}
  </body>
</html>
