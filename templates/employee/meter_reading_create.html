{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h1 class="h3 mb-3">Добавить показание</h1>
          <p class="text-muted">Потребитель: <strong>{{ consumer.full_name }}</strong></p>
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{% url 'consumer_detail' consumer.pk %}" class="btn btn-outline-secondary">Назад</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
